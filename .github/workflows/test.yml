name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: serenity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Throwaway CI database; the pg_repo fixture wipes it before every test.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/serenity_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check serenity tests

      - name: Test
        run: uv run pytest
