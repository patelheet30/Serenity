name: Deploy to Oracle Cloud

on:
  push:
    branches: 
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy files to Server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/serenity"

      - name: Build, health-check and roll back if needed
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 20m
          # Builds, waits for /health, and rolls back to the previous image if the new one
          # never gets healthy (the step then fails). See scripts/deploy.sh.
          script: bash /home/ubuntu/serenity/scripts/deploy.sh