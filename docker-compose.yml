services:
  serenity:
    build: .                           # Tells Docker to use your Dockerfile
    container_name: serenity
    restart: unless-stopped
    env_file:
      - .env                           # Loads your secret Discord Token
    environment:
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production         # label on the serenity_bot_info metric
      - METRICS_PORT=${METRICS_PORT:-8080}  # pinned here so the app, port mapping and healthcheck always agree
      # libpq-style vars; asyncpg and psql read these directly, so the password needs no URL-encoding
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER:-serenity}
      - PGPASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - PGDATABASE=${POSTGRES_DB:-serenity}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:                       # /health only answers once startup (Discord, DB, migrations) is done
      test: ["CMD", "curl", "-fsS", "http://localhost:${METRICS_PORT:-8080}/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    ports:
      # /metrics, /health and /api (main.py reads METRICS_PORT). Bound to the docker0 bridge
      # address only: Prometheus scrapes 172.17.0.1, the public reaches /api through `dashboard`.
      - "172.17.0.1:${METRICS_PORT:-8080}:${METRICS_PORT:-8080}"
    volumes:
      - ./bot_data:/data               # holds the old SQLite file (rollback copy from the Postgres move)

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_SITE_URL: ${DASHBOARD_URL:-}
    container_name: serenity-dashboard
    restart: unless-stopped
    environment:
      - METRICS_PORT=${METRICS_PORT:-8080}
    ports:
      # Nginx Proxy Manager (owns 80/443, does HTTPS) forwards the dashboard domain to 172.17.0.1:8090
      - "172.17.0.1:8090:80"

  postgres:
    image: postgres:18-alpine
    container_name: serenity-postgres
    restart: unless-stopped
    mem_limit: 512m                    # Sizing rationale in issue #12
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-serenity}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-serenity}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports: only reachable from this compose network as postgres:5432
    volumes:
      - pgdata:/var/lib/postgresql     # PG18+ layout; data lives in /var/lib/postgresql/18/docker

volumes:
  pgdata:
