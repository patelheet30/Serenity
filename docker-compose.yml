services:
  serenity:
    build: .                           # Tells Docker to use your Dockerfile
    container_name: serenity
    restart: unless-stopped
    env_file:
      - .env                           # Loads your secret Discord Token
    environment:
      - LOG_LEVEL=INFO                 # From your fly.toml
      # libpq-style vars; asyncpg and psql read these directly, so the password needs no URL-encoding
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER:-serenity}
      - PGPASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - PGDATABASE=${POSTGRES_DB:-serenity}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"                    # Exposes your Prometheus metrics port
    volumes:
      - ./bot_data:/data               # Replaces your Fly volume mount

  postgres:
    image: postgres:18-alpine
    container_name: serenity-postgres
    restart: unless-stopped
    mem_limit: 512m                    # Sizing rationale in issue #12
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-serenity}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-serenity}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports: only reachable from this compose network as postgres:5432
    volumes:
      - pgdata:/var/lib/postgresql     # PG18+ layout; data lives in /var/lib/postgresql/18/docker

volumes:
  pgdata:
